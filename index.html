<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MangaReader">
<title>Manga Guided Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body, html { width: 100%; height: 100%; background: #0d0d0d; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

  #setup-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 24px; text-align: center; gap: 16px;
  }
  h1 { font-size: 24px; font-weight: 700; }
  p.sub { font-size: 13px; color: #999; max-width: 320px; line-height: 1.4; }

  .active-mode-banner {
    background: rgba(229, 9, 20, 0.14); border: 1px solid rgba(229, 9, 20, 0.45);
    color: #ff9a9f; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }

  .toggle-group { display: flex; background: #1e1e1e; border-radius: 12px; padding: 4px; width: 100%; max-width: 350px; }
  .toggle-btn {
    flex: 1; padding: 11px 6px; border: none; background: transparent; color: #888;
    font-size: 12.5px; font-weight: 600; border-radius: 9px; cursor: pointer; transition: 0.2s;
  }
  .toggle-btn.active { background: #e50914; color: #fff; box-shadow: 0 2px 8px rgba(229, 9, 20, 0.35); }
  #grid-group .toggle-btn.active { background: #333; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

  .file-label {
    background: #e50914; color: #fff; padding: 15px 28px; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 350px;
    display: inline-block; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
  }
  #pdf-input { position: absolute; opacity: 0; width: 1px; height: 1px; }

  #status-msg { color: #ff7b7b; font-size: 13px; max-width: 330px; min-height: 18px; line-height: 1.35; }

  #reader-screen { display: none; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
  #viewport {
    width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
    transform-origin: 0 0; transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  canvas { max-width: 100%; max-height: 100%; display: block; }

  .touch-zone { position: absolute; top: 0; height: 100%; z-index: 10; }
  #zone-prev { left: 0; width: 25%; }
  #zone-next { right: 0; width: 75%; }

  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: calc(env(safe-area-inset-top, 16px) + 8px) 14px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    display: flex; flex-direction: column; gap: 10px; z-index: 20; transition: opacity 0.25s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hud-btn {
    background: rgba(255,255,255,0.18); border: none; color: #fff; padding: 7px 11px;
    border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  #page-info { font-size: 12px; font-weight: 600; color: #eee; text-align: center; flex: 1; }

  .zoom-bar {
    display: flex; align-items: center; gap: 10px; background: rgba(20,20,20,0.8);
    padding: 6px 12px; border-radius: 10px;
  }
  .zoom-label { font-size: 12px; color: #ccc; min-width: 78px; font-weight: 600; }
  #zoom-slider { flex: 1; accent-color: #e50914; }

  #loader {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    justify-content: center; align-items: center; z-index: 50; font-size: 16px; font-weight: 600;
  }
</style>
</head>
<body>

<div id="loader">Caricamento tavola...</div>

<div id="setup-screen">
  <div>
    <h1>Manga Guided View</h1>
    <p class="sub" style="margin-top:6px;">Tap singolo: vignetta/zona • Doppio tap: cambia pagina.</p>
  </div>

  <div class="active-mode-banner" id="active-mode-banner">Modalità attiva: Manga (Destra → Sinistra)</div>

  <div class="toggle-group" id="dir-group">
    <button type="button" class="toggle-btn active" id="btn-rtl" onclick="setDirection('rtl')">← Manga (Destra-Sinistra)</button>
    <button type="button" class="toggle-btn" id="btn-ltr" onclick="setDirection('ltr')">Occidentale (Sinistra-Destra) →</button>
  </div>

  <div class="toggle-group" id="grid-group">
    <button type="button" class="toggle-btn active" id="btn-mode-auto" onclick="setMode('auto')">Auto-Vignette</button>
    <button type="button" class="toggle-btn" id="btn-mode-4" onclick="setMode(4)">4 Zone</button>
    <button type="button" class="toggle-btn" id="btn-mode-6" onclick="setMode(6)">6 Zone</button>
  </div>

  <label class="file-label" for="pdf-input">Scegli PDF da File</label>
  <input type="file" id="pdf-input" accept="application/pdf,.pdf">
  <div id="status-msg"></div>
</div>

<div id="reader-screen">
  <div id="hud">
    <div class="hud-row">
      <button type="button" class="hud-btn" onclick="closeReader()">✕ Chiudi</button>
      <span id="page-info">Pag. 1 / 1 • Manga • Auto</span>
      <button type="button" class="hud-btn" id="btn-overview" onclick="toggleOverview()">Pagina Intera</button>
    </div>
    <div class="zoom-bar" onclick="event.stopPropagation()">
      <span class="zoom-label" id="zoom-readout">Zoom: 1.85x</span>
      <input type="range" id="zoom-slider" min="1.2" max="2.8" step="0.05" value="1.85" oninput="onZoomChange(this.value)">
    </div>
  </div>

  <div id="viewport">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <div id="zone-prev" class="touch-zone"></div>
  <div id="zone-next" class="touch-zone"></div>
</div>

<script>
  const memoryStore = {};

  function readStore(k) {
    try {
      if (window.localStorage) return window.localStorage.getItem(k);
    } catch (e) {}
    return memoryStore[k] || null;
  }

  function writeStore(k, v) {
    memoryStore[k] = v;
    try {
      if (window.localStorage) window.localStorage.setItem(k, v);
    } catch (e) {}
  }

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  let pdfDoc = null;
  let bookKey = null;
  let currentPage = 1;
  let totalPages = 0;
  let direction = 'rtl';
  let viewMode = 'auto'; // 'auto', 4, 6
  let currentStep = 0;
  let activeZones = [];
  let zoomScale = parseFloat(readStore('mr_zoom')) || 1.85;
  let isOverview = false;
  let hudTimer = null;

  const canvas = document.getElementById('pdf-canvas');
  const ctx = canvas.getContext('2d');
  const viewport = document.getElementById('viewport');
  const zoomSlider = document.getElementById('zoom-slider');
  const zoomReadout = document.getElementById('zoom-readout');
  const statusMsg = document.getElementById('status-msg');
  const activeModeBanner = document.getElementById('active-mode-banner');

  zoomSlider.value = zoomScale;
  zoomReadout.innerText = 'Zoom: ' + zoomScale.toFixed(2) + 'x';

  function updateDirectionLabels() {
    const isRtl = direction === 'rtl';
    activeModeBanner.innerText = isRtl
      ? 'Modalità attiva: Manga (Destra → Sinistra)'
      : 'Modalità attiva: Occidentale (Sinistra → Destra)';
    if (pdfDoc) {
      rebuildZonesForCurrentPage(true);
    }
  }

  function setDirection(dir) {
    direction = dir;
    document.getElementById('btn-rtl').classList.toggle('active', dir === 'rtl');
    document.getElementById('btn-ltr').classList.toggle('active', dir === 'ltr');
    updateDirectionLabels();
    saveState();
  }

  function setMode(mode) {
    viewMode = mode;
    document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'auto');
    document.getElementById('btn-mode-4').classList.toggle('active', mode === 4);
    document.getElementById('btn-mode-6').classList.toggle('active', mode === 6);
    if (pdfDoc) {
      rebuildZonesForCurrentPage(true);
    }
    saveState();
  }

  function saveState() {
    if (!bookKey) return;
    writeStore(bookKey, JSON.stringify({
      page: currentPage,
      step: currentStep,
      viewMode: viewMode,
      direction: direction
    }));
  }

  document.getElementById('pdf-input').addEventListener('change', async function(e) {
    statusMsg.innerText = '';
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!window.pdfjsLib) {
      statusMsg.innerText = 'PDF.js non caricato. Controlla la connessione internet.';
      return;
    }

    document.getElementById('loader').style.display = 'flex';
    try {
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      totalPages = pdfDoc.numPages;
      bookKey = 'mr_' + file.name + '_' + file.size + '_' + totalPages;

      let startPage = 1;
      let startStep = 0;
      const raw = readStore(bookKey);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && saved.page >= 1 && saved.page <= totalPages) {
          if (confirm('Riprendere da Pagina ' + saved.page + ' (Tavola ' + ((saved.step || 0) + 1) + ')?')) {
            startPage = saved.page;
            startStep = saved.step || 0;
            if (saved.direction) setDirection(saved.direction);
            if (saved.viewMode) setMode(saved.viewMode);
          }
        }
      }

      currentPage = startPage;
      currentStep = startStep;
      isOverview = false;

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('reader-screen').style.display = 'block';
      await renderPage(currentPage, currentStep);
      saveState();
    } catch (err) {
      statusMsg.innerText = 'Errore nell\'apertura del PDF.';
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  });

  function buildGridZones(rows) {
    const list = [];
    for (let r = 0; r < rows; r++) {
      const cols = direction === 'rtl' ? [1, 0] : [0, 1];
      for (let i = 0; i < cols.length; i++) {
        const c = cols[i];
        const xRatio = c === 0 ? 0 : 1;
        const yRatio = rows === 2 ? (r === 0 ? 0 : 1) : (r === 0 ? 0 : (r === 1 ? 0.5 : 1));
        list.push({ xRatio: xRatio, yRatio: yRatio, scale: zoomScale, isPanel: false });
      }
    }
    return list;
  }

  function detectPanelsFromCanvas() {
    const w = 180;
    const h = Math.max(120, Math.round((canvas.height / canvas.width) * w));
    const tmp = document.createElement('canvas');
    tmp.width = w;
    tmp.height = h;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(canvas, 0, 0, w, h);

    const data = tctx.getImageData(0, 0, w, h).data;
    const mask = new Uint8Array(w * h);

    // Identifica pixel non vicini al bianco puro (contenuto grafico/vignette)
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum < 238) {
          mask[y * w + x] = 1;
        }
      }
    }

    // Blocchi di scansione per unire dettagli vicini e ridurre frammenti
    const cellW = 10;
    const cellH = 10;
    const gw = Math.ceil(w / cellW);
    const gh = Math.ceil(h / cellH);
    const grid = new Uint8Array(gw * gh);

    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        let activeCount = 0;
        let totalCount = 0;
        for (let dy = 0; dy < cellH && gy * cellH + dy < h; dy++) {
          for (let dx = 0; dx < cellW && gx * cellW + dx < w; dx++) {
            totalCount++;
            if (mask[(gy * cellH + dy) * w + (gx * cellW + dx)]) activeCount++;
          }
        }
        if (totalCount > 0 && activeCount / totalCount > 0.16) {
          grid[gy * gw + gx] = 1;
        }
      }
    }

    const visited = new Uint8Array(gw * gh);
    let boxes = [];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        const start = gy * gw + gx;
        if (!grid[start] || visited[start]) continue;

        const queue = [start];
        visited[start] = 1;
        let minX = gx, maxX = gx, minY = gy, maxY = gy, cells = 0;

        while (queue.length > 0) {
          const cur = queue.shift();
          const cx = cur % gw;
          const cy = Math.floor(cur / gw);
          cells++;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;

          for (let d = 0; d < dirs.length; d++) {
            const nx = cx + dirs[d][0];
            const ny = cy + dirs[d][1];
            if (nx >= 0 && nx < gw && ny >= 0 && ny < gh) {
              const nIdx = ny * gw + nx;
              if (grid[nIdx] && !visited[nIdx]) {
                visited[nIdx] = 1;
                queue.push(nIdx);
              }
            }
          }
        }

        const bw = (maxX - minX + 1) / gw;
        const bh = (maxY - minY + 1) / gh;
        if (cells >= 2 && bw >= 0.12 && bh >= 0.08) {
          boxes.push({
            x0: Math.max(0, minX / gw - 0.02),
            y0: Math.max(0, minY / gh - 0.02),
            x1: Math.min(1, (maxX + 1) / gw + 0.02),
            y1: Math.min(1, (maxY + 1) / gh + 0.02)
          });
        }
      }
    }

    if (boxes.length < 2 || boxes.length > 12) {
      return null;
    }

    // Ordina le vignette secondo il senso di lettura (fasce verticali + direzione orizzontale)
    boxes.sort(function(a, b) {
      const aMidY = (a.y0 + a.y1) / 2;
      const bMidY = (b.y0 + b.y1) / 2;
      const aH = a.y1 - a.y0;
      const bH = b.y1 - b.y0;
      const sameBand = Math.abs(aMidY - bMidY) < Math.min(aH, bH) * 0.55;
      if (!sameBand) return aMidY - bMidY;
      const aMidX = (a.x0 + a.x1) / 2;
      const bMidX = (b.x0 + b.x1) / 2;
      return direction === 'rtl' ? (bMidX - aMidX) : (aMidX - bMidX);
    });

    return boxes.map(function(b) {
      const bw = Math.max(0.15, b.x1 - b.x0);
      const bh = Math.max(0.15, b.y1 - b.y0);
      const fitScale = Math.min(2.8, Math.max(1.35, Math.min(0.88 / bw, 0.88 / bh)));
      const cx = (b.x0 + b.x1) / 2;
      const cy = (b.y0 + b.y1) / 2;
      return {
        cx: cx,
        cy: cy,
        scale: Math.max(zoomScale, fitScale * 0.85),
        isPanel: true
      };
    });
  }

  function rebuildZonesForCurrentPage(keepRelativePosition) {
    const prevLen = activeZones.length || 1;
    if (viewMode === 'auto') {
      const detected = detectPanelsFromCanvas();
      activeZones = detected || buildGridZones(4);
    } else {
      activeZones = buildGridZones(viewMode);
    }

    if (keepRelativePosition) {
      currentStep = Math.min(currentStep, activeZones.length - 1);
    } else {
      currentStep = 0;
    }
    if (currentStep < 0) currentStep = 0;
    updateHud();
    applyZoom();
  }

  async function renderPage(num, initialStep) {
    const page = await pdfDoc.getPage(num);
    const unscaled = page.getViewport({ scale: 1 });
    const factor = Math.max(2.2, zoomScale * 1.3);
    const scale = Math.min((window.innerWidth * factor) / unscaled.width, (window.innerHeight * factor) / unscaled.height);
    const vp = page.getViewport({ scale: scale });

    canvas.width = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: ctx, viewport: vp }).promise;

    rebuildZonesForCurrentPage(false);
    if (typeof initialStep === 'number') {
      currentStep = Math.min(Math.max(0, initialStep), activeZones.length - 1);
      updateHud();
      applyZoom();
    }
  }

  function applyZoom() {
    if (isOverview || !activeZones.length) {
      viewport.style.transform = 'translate(0px, 0px) scale(1)';
      document.getElementById('btn-overview').innerText = 'Zoom Tavola';
      return;
    }
    document.getElementById('btn-overview').innerText = 'Pagina Intera';

    const z = activeZones[Math.min(currentStep, activeZones.length - 1)];
    const baseW = canvas.offsetWidth;
    const baseH = canvas.offsetHeight;
    const offsetX = (window.innerWidth - baseW) / 2;
    const offsetY = (window.innerHeight - baseH) / 2;

    const effectiveScale = viewMode === 'auto' && z.isPanel ? Math.min(2.8, Math.max(1.2, (zoomScale / 1.85) * z.scale)) : zoomScale;

    let tx, ty;
    if (z.isPanel) {
      const targetScreenX = window.innerWidth * 0.5;
      const targetScreenY = window.innerHeight * 0.5;
      const canvasPointX = offsetX + baseW * z.cx;
      const canvasPointY = offsetY + baseH * z.cy;
      tx = targetScreenX - canvasPointX * effectiveScale;
      ty = targetScreenY - canvasPointY * effectiveScale;

      const minTx = window.innerWidth - (offsetX + baseW) * effectiveScale;
      const maxTx = -offsetX * effectiveScale;
      const minTy = window.innerHeight - (offsetY + baseH) * effectiveScale;
      const maxTy = -offsetY * effectiveScale;

      if (minTx <= maxTx) tx = Math.min(maxTx, Math.max(minTx, tx));
      if (minTy <= maxTy) ty = Math.min(maxTy, Math.max(minTy, ty));
    } else {
      const maxPanX = Math.max(0, baseW * effectiveScale - window.innerWidth);
      const maxPanY = Math.max(0, baseH * effectiveScale - window.innerHeight);
      tx = -offsetX * effectiveScale - maxPanX * (z.xRatio || 0);
      ty = -offsetY * effectiveScale - maxPanY * (z.yRatio || 0);
    }

    viewport.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + effectiveScale + ')';
  }

  function onZoomChange(v) {
    zoomScale = parseFloat(v);
    isOverview = false;
    zoomReadout.innerText = 'Zoom: ' + zoomScale.toFixed(2) + 'x';
    writeStore('mr_zoom', String(zoomScale));
    applyZoom();
    showHud();
  }

  async function goToPage(targetPage, stepIndex) {
    if (!pdfDoc || targetPage < 1 || targetPage > totalPages) return;
    document.getElementById('loader').style.display = 'flex';
    currentPage = targetPage;
    isOverview = false;
    await renderPage(currentPage, stepIndex || 0);
    saveState();
    document.getElementById('loader').style.display = 'none';
  }

  async function nextStep() {
    showHud();
    if (isOverview) {
      isOverview = false;
      applyZoom();
      return;
    }
    if (currentStep < activeZones.length - 1) {
      currentStep++;
      applyZoom();
      updateHud();
      saveState();
    } else if (currentPage < totalPages) {
      await goToPage(currentPage + 1, 0);
    }
  }

  async function prevStep() {
    showHud();
    if (isOverview) {
      isOverview = false;
      applyZoom();
      return;
    }
    if (currentStep > 0) {
      currentStep--;
      applyZoom();
      updateHud();
      saveState();
    } else if (currentPage > 1) {
      await goToPage(currentPage - 1, 0);
    }
  }

  function toggleOverview() {
    isOverview = !isOverview;
    applyZoom();
    showHud();
  }

  function updateHud() {
    const modeShort = direction === 'rtl' ? 'Manga' : 'Occidentale';
    const layoutLabel = viewMode === 'auto' ? (activeZones[0] && activeZones[0].isPanel ? 'Auto' : 'Auto→Griglia') : (viewMode + 'Z');
    const totalSteps = activeZones.length || 1;
    document.getElementById('page-info').innerText = 'Pag. ' + currentPage + ' / ' + totalPages + ' • ' + modeShort + ' • ' + layoutLabel + ' ' + (currentStep + 1) + '/' + totalSteps;
  }

  function showHud() {
    const hud = document.getElementById('hud');
    hud.classList.remove('hidden');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function() { hud.classList.add('hidden'); }, 3000);
  }

  function closeReader() {
    saveState();
    document.getElementById('reader-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('pdf-input').value = '';
  }

  // Gestione Tap Singolo (vignetta/zona) vs Doppio Tap (cambia pagina)
  function attachTapHandler(el, onSingle, onDouble) {
    let clickTimer = null;
    el.addEventListener('click', function(e) {
      e.preventDefault();
      if (clickTimer !== null) {
        clearTimeout(clickTimer);
        clickTimer = null;
        onDouble();
      } else {
        clickTimer = setTimeout(function() {
          clickTimer = null;
          onSingle();
        }, 230);
      }
    });
  }

  attachTapHandler(
    document.getElementById('zone-next'),
    nextStep,
    function() {
      showHud();
      if (currentPage < totalPages) goToPage(currentPage + 1, 0);
    }
  );

  attachTapHandler(
    document.getElementById('zone-prev'),
    prevStep,
    function() {
      showHud();
      if (currentPage > 1) goToPage(currentPage - 1, 0);
    }
  );
</script>
</body>
</html>
