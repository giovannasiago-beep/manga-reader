<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MangaReader">
<title>Manga Guided Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body, html { width: 100%; height: 100%; background: #0d0d0d; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

  /* Schermata Iniziale */
  #setup-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 24px; text-align: center; gap: 20px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  p.sub { font-size: 14px; color: #999; max-width: 310px; line-height: 1.4; }

  .toggle-group { display: flex; background: #1e1e1e; border-radius: 12px; padding: 4px; width: 100%; max-width: 340px; }
  .toggle-btn {
    flex: 1; padding: 12px 8px; border: none; background: transparent; color: #888;
    font-size: 13px; font-weight: 600; border-radius: 9px; transition: 0.2s; cursor: pointer;
  }
  .toggle-btn.active { background: #333; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

  .file-label {
    background: #e50914; color: white; padding: 16px 32px; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 340px;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4); transition: transform 0.1s; display: inline-block;
  }
  .file-label:active { transform: scale(0.97); }
  #pdf-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

  #error-msg {
    color: #ff6b6b; font-size: 13px; max-width: 330px; min-height: 18px; line-height: 1.35;
  }

  /* Schermata Lettore */
  #reader-screen { display: none; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
  #viewport {
    width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
    transform-origin: 0 0; transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  canvas { max-width: 100%; max-height: 100%; display: block; }

  /* Zone Touch */
  .touch-zone { position: absolute; top: 0; height: 100%; z-index: 10; }
  #zone-prev { left: 0; width: 25%; }
  #zone-next { right: 0; width: 75%; }

  /* HUD Barra Superiore e Controllo Zoom */
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: calc(env(safe-area-inset-top, 16px) + 8px) 14px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.4) 70%, transparent);
    display: flex; flex-direction: column; gap: 10px; z-index: 20;
    transition: opacity 0.25s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hud-btn {
    background: rgba(255,255,255,0.16); border: none; color: #fff; padding: 7px 12px;
    border-radius: 8px; font-size: 13px; font-weight: 500; backdrop-filter: blur(8px); cursor: pointer;
  }
  .hud-btn:active { background: rgba(255,255,255,0.28); }
  #page-info { font-size: 12px; font-weight: 600; color: #eee; text-align: center; flex: 1; }

  .zoom-bar {
    display: flex; align-items: center; gap: 10px; background: rgba(20,20,20,0.75);
    padding: 6px 12px; border-radius: 10px; backdrop-filter: blur(8px);
  }
  .zoom-label { font-size: 12px; color: #ccc; min-width: 78px; font-weight: 600; }
  input[type="range"]#zoom-slider {
    flex: 1; accent-color: #e50914; height: 4px; cursor: pointer;
  }
