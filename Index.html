<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MangaReader">
<title>Manga Guided Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body, html { width: 100%; height: 100%; background: #0d0d0d; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

  /* Schermata Iniziale */
  #setup-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 24px; text-align: center; gap: 20px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  p.sub { font-size: 14px; color: #999; max-width: 310px; line-height: 1.4; }

  .toggle-group { display: flex; background: #1e1e1e; border-radius: 12px; padding: 4px; width: 100%; max-width: 340px; }
  .toggle-btn {
    flex: 1; padding: 12px 8px; border: none; background: transparent; color: #888;
    font-size: 13px; font-weight: 600; border-radius: 9px; transition: 0.2s; cursor: pointer;
  }
  .toggle-btn.active { background: #333; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

  .file-label {
    background: #e50914; color: white; padding: 16px 32px; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 340px;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4); transition: transform 0.1s; display: inline-block;
  }
  .file-label:active { transform: scale(0.97); }
  #pdf-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

  #error-msg {
    color: #ff6b6b; font-size: 13px; max-width: 330px; min-height: 18px; line-height: 1.35;
  }

  /* Schermata Lettore */
  #reader-screen { display: none; width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }
  #viewport {
    width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
    transform-origin: 0 0; transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  canvas { max-width: 100%; max-height: 100%; display: block; }

  /* Zone Touch */
  .touch-zone { position: absolute; top: 0; height: 100%; z-index: 10; }
  #zone-prev { left: 0; width: 25%; }
  #zone-next { right: 0; width: 75%; }

  /* HUD Barra Superiore e Controllo Zoom */
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: calc(env(safe-area-inset-top, 16px) + 8px) 14px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.4) 70%, transparent);
    display: flex; flex-direction: column; gap: 10px; z-index: 20;
    transition: opacity 0.25s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hud-btn {
    background: rgba(255,255,255,0.16); border: none; color: #fff; padding: 7px 12px;
    border-radius: 8px; font-size: 13px; font-weight: 500; backdrop-filter: blur(8px); cursor: pointer;
  }
  .hud-btn:active { background: rgba(255,255,255,0.28); }
  #page-info { font-size: 12px; font-weight: 600; color: #eee; text-align: center; flex: 1; }

  .zoom-bar {
    display: flex; align-items: center; gap: 10px; background: rgba(20,20,20,0.75);
    padding: 6px 12px; border-radius: 10px; backdrop-filter: blur(8px);
  }
  .zoom-label { font-size: 12px; color: #ccc; min-width: 78px; font-weight: 600; }
  input[type="range"]#zoom-slider {
    flex: 1; accent-color: #e50914; height: 4px; cursor: pointer;
  }

  /* Modal Ripresa Lettura */
  #resume-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none;
    justify-content: center; align-items: center; z-index: 60; padding: 20px;
  }
  .modal-card {
    background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 16px;
    padding: 22px; max-width: 340px; width: 100%; text-align: center;
  }
  .modal-card h2 { font-size: 18px; margin-bottom: 8px; }
  .modal-card p { font-size: 14px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-secondary { background: #2d2d2d; color: #ddd; }
  .btn-primary { background: #e50914; color: #fff; }

  #loader {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    justify-content: center; align-items: center; z-index: 50; font-size: 16px; font-weight: 600;
  }
</style>
</head>
<body>

<div id="loader">Caricamento tavola...</div>

<div id="resume-modal">
  <div class="modal-card">
    <h2>Lettura salvata</h2>
    <p id="resume-text">Vuoi riprendere da dove avevi lasciato?</p>
    <div class="modal-actions">
      <button type="button" class="modal-btn btn-secondary" onclick="resolveResume(false)">Da inizio</button>
      <button type="button" class="modal-btn btn-primary" onclick="resolveResume(true)">Riprendi</button>
    </div>
  </div>
</div>

<!-- SETUP -->
<div id="setup-screen">
  <div>
    <h1>Manga Guided View</h1>
    <p class="sub" style="margin-top:8px;">Scegli il senso di lettura e apri un PDF dall'app File.</p>
  </div>

  <div class="toggle-group">
    <button type="button" class="toggle-btn active" id="btn-rtl" onclick="setDirection('rtl')">← Manga (Destra-Sinistra)</button>
    <button type="button" class="toggle-btn" id="btn-ltr" onclick="setDirection('ltr')">Occidentale (Sinistra-Destra) →</button>
  </div>

  <div class="toggle-group">
    <button type="button" class="toggle-btn active" id="btn-grid4" onclick="setGrid(4)">4 Zone (Standard)</button>
    <button type="button" class="toggle-btn" id="btn-grid6" onclick="setGrid(6)">6 Zone (Dettaglio)</button>
  </div>

  <label class="file-label" for="pdf-input">Scegli PDF da File</label>
  <input type="file" id="pdf-input" accept="application/pdf,.pdf">
  <div id="error-msg"></div>
</div>

<!-- READER -->
<div id="reader-screen">
  <div id="hud">
    <div class="hud-row">
      <button type="button" class="hud-btn" onclick="closeReader()">✕ Chiudi</button>
      <span id="page-info">Pag. 1 / 1</span>
      <button type="button" class="hud-btn" id="btn-overview" onclick="toggleOverview()">Pagina Intera</button>
    </div>
    <div class="zoom-bar" onclick="event.stopPropagation()">
      <span class="zoom-label" id="zoom-readout">Zoom: 1.85x</span>
      <input type="range" id="zoom-slider" min="1.2" max="2.8" step="0.05" value="1.85" oninput="onZoomChange(this.value)">
    </div>
  </div>

  <div id="viewport">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <div id="zone-prev" class="touch-zone" onclick="prevStep()"></div>
  <div id="zone-next" class="touch-zone" onclick="nextStep()"></div>
</div>

<script>
  const STORAGE_PREFIX = 'manga_reader_progress_v1_';
  const ZOOM_STORAGE_KEY = 'manga_reader_zoom_v1';

  function safeGet(key) {
    try {
      return window.localStorage ? window.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (window.localStorage) window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  let pdfDoc = null;
  let currentBookKey = null;
  let currentPage = 1;
  let totalPages = 0;
  let direction = 'rtl';
  let gridMode = 4;
  let currentStep = 0;
  let zoomScale = parseFloat(safeGet(ZOOM_STORAGE_KEY)) || 1.85;
  let isOverview = false;
  let hudTimeout = null;
  let pendingSavedState = null;

  const canvas = document.getElementById('pdf-canvas');
  const ctx = canvas.getContext('2d');
  const viewport = document.getElementById('viewport');
  const zoomSlider = document.getElementById('zoom-slider');
  const zoomReadout = document.getElementById('zoom-readout');
  const errorMsg = document.getElementById('error-msg');

  function setError(msg) {
    errorMsg.innerText = msg || '';
  }

  function syncZoomUI() {
    zoomSlider.value = zoomScale;
    zoomReadout.innerText = `Zoom: ${zoomScale.toFixed(2)}x`;
  }
  syncZoomUI();

  function setDirection(dir) {
    direction = dir;
    document.getElementById('btn-rtl').classList.toggle('active', dir === 'rtl');
    document.getElementById('btn-ltr').classList.toggle('active', dir === 'ltr');
  }

  function setGrid(num) {
    gridMode = num;
    document.getElementById('btn-grid4').classList.toggle('active', num === 4);
    document.getElementById('btn-grid6').classList.toggle('active', num === 6);
  }

  function buildBookKey(file, pagesCount) {
    return `${STORAGE_PREFIX}${encodeURIComponent(file.name)}_${file.size}_p${pagesCount}`;
  }

  function saveProgress() {
    if (!currentBookKey) return;
    const payload = {
      page: currentPage,
      step: currentStep,
      gridMode: gridMode,
      direction: direction,
      updatedAt: Date.now()
    };
    safeSet(currentBookKey, JSON.stringify(payload));
  }

  function loadProgress(key) {
    const raw = safeGet(key);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  document.getElementById('pdf-input').addEventListener('change', async (e) => {
    setError('');
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!window.pdfjsLib) {
      setError('Libreria PDF non caricata: verifica la connessione per caricare PDF.js.');
      return;
    }

    showLoader(true);
    try {
      const arrayBuffer = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      currentBookKey = buildBookKey(file, totalPages);

      const saved = loadProgress(currentBookKey);
      showLoader(false);

      if (saved && saved.page >= 1 && saved.page <= totalPages && (saved.page > 1 || saved.step > 0)) {
        pendingSavedState = saved;
        document.getElementById('resume-text').innerText =
          `Sei arrivato a Pagina ${saved.page} / ${totalPages} (Zona ${saved.step + 1}). Vuoi riprendere da lì?`;
        document.getElementById('resume-modal').style.display = 'flex';
      } else {
        await startReading(1, 0);
      }
    } catch (err) {
      showLoader(false);
      setError('Impossibile aprire il PDF. Controlla che il file non sia protetto da password o danneggiato.');
    }
  });

  async function resolveResume(shouldResume) {
    document.getElementById('resume-modal').style.display = 'none';
    if (shouldResume && pendingSavedState) {
      if (pendingSavedState.direction) setDirection(pendingSavedState.direction);
      if (pendingSavedState.gridMode) setGrid(pendingSavedState.gridMode);
      const safeStep = Math.min(pendingSavedState.step || 0, gridMode - 1);
      await startReading(pendingSavedState.page, safeStep);
    } else {
      await startReading(1, 0);
    }
    pendingSavedState = null;
  }

  async function startReading(pageNum, stepIdx) {
    showLoader(true);
    currentPage = pageNum;
    currentStep = stepIdx;
    isOverview = false;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('reader-screen').style.display = 'block';
    await renderPage(currentPage);
    saveProgress();
    showLoader(false);
    showHudTemporarily();
  }

  async function renderPage(num) {
    const page = await pdfDoc.getPage(num);
    const unscaledViewport = page.getViewport({ scale: 1 });
    const renderFactor = Math.max(2.5, zoomScale * 1.4);
    const scale = Math.min((window.innerWidth * renderFactor) / unscaledViewport.width, (window.innerHeight * renderFactor) / unscaledViewport.height);
    const pdfViewport = page.getViewport({ scale: scale });

    canvas.width = pdfViewport.width;
    canvas.height = pdfViewport.height;

    await page.render({ canvasContext: ctx, viewport: pdfViewport }).promise;
    updateHUD();
    applyZoom();
  }

  function getZones() {
    const rows = gridMode === 4 ? 2 : 3;
    const zones = [];

    for (let r = 0; r < rows; r++) {
      const colOrder = direction === 'rtl' ? [1, 0] : [0, 1];
      for (const c of colOrder) {
        const xRatio = c === 0 ? 0 : 1;
        const yRatio = rows === 2 ? (r === 0 ? 0 : 1) : (r === 0 ? 0 : r === 1 ? 0.5 : 1);
        zones.push({ xRatio, yRatio, scale: zoomScale });
      }
    }
    return zones;
  }

  function applyZoom() {
    if (isOverview) {
      viewport.style.transform = `translate(0px, 0px) scale(1)`;
      document.getElementById('btn-overview').innerText = 'Zoom Zona';
      return;
    }
    document.getElementById('btn-overview').innerText = 'Pagina Intera';

    const zones = getZones();
    const safeIndex = Math.min(currentStep, zones.length - 1);
    const z = zones[safeIndex];

    const baseW = canvas.offsetWidth;
    const baseH = canvas.offsetHeight;
    const offsetX = (window.innerWidth - baseW) / 2;
    const offsetY = (window.innerHeight - baseH) / 2;

    const scaledW = baseW * z.scale;
    const scaledH = baseH * z.scale;

    const maxPanX = Math.max(0, scaledW - window.innerWidth);
    const maxPanY = Math.max(0, scaledH - window.innerHeight);

    const tx = -offsetX * z.scale - (maxPanX * z.xRatio);
    const ty = -offsetY * z.scale - (maxPanY * z.yRatio);

    viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${z.scale})`;
  }

  function onZoomChange(val) {
    zoomScale = parseFloat(val);
    isOverview = false;
    syncZoomUI();
    safeSet(ZOOM_STORAGE_KEY, String(zoomScale));
    applyZoom();
    showHudTemporarily();
  }

  async function nextStep() {
    showHudTemporarily();
    if (isOverview) {
      isOverview = false;
      applyZoom();
      return;
    }
    const maxSteps = gridMode;
    if (currentStep < maxSteps - 1) {
      currentStep++;
      applyZoom();
      updateHUD();
      saveProgress();
    } else if (currentPage < totalPages) {
      showLoader(true);
      currentPage++;
      currentStep = 0;
      await renderPage(currentPage);
      saveProgress();
      showLoader(false);
    }
  }

  async function prevStep() {
    showHudTemporarily();
    if (isOverview) {
      isOverview = false;
      applyZoom();
      return;
    }
    if (currentStep > 0) {
      currentStep--;
      applyZoom();
      updateHUD();
      saveProgress();
    } else if (currentPage > 1) {
      showLoader(true);
      currentPage--;
      currentStep = gridMode - 1;
      await renderPage(currentPage);
      saveProgress();
      showLoader(false);
    }
  }

  function toggleOverview() {
    isOverview = !isOverview;
    applyZoom();
    showHudTemporarily();
  }

  function updateHUD() {
    document.getElementById('page-info').innerText = `Pag. ${currentPage} / ${totalPages}  •  Zona ${currentStep + 1}/${gridMode}`;
  }

  function showHudTemporarily() {
    const hud = document.getElementById('hud');
    hud.classList.remove('hidden');
    clearTimeout(hudTimeout);
    hudTimeout = setTimeout(() => hud.classList.add('hidden'), 3200);
  }

  function closeReader() {
    saveProgress();
    document.getElementById('reader-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('pdf-input').value = '';
  }

  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
  }
</script>
</body>
</html>
